<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Garden · Companion motion review</title><link rel="stylesheet" href="mochi-widget.css"><style>body{margin:0;padding:24px;background:#f5f3e9;color:#214239;font:17px system-ui}main{max-width:840px;margin:auto}h1{font-size:28px}.examples{display:flex;gap:20px;flex-wrap:wrap}.examples>section{flex:1;min-width:240px}button{font:inherit;padding:10px;margin:5px;min-height:44px}#ledge{background:#e0e7d4;border-radius:20px}.mochi-widget{width:100%}.mochi-widget .mochi-stage{aspect-ratio:1.4}.mochi-options [data-mochi=sound],.mochi-audio,.mochi-sound-credits{display:none}.note{line-height:1.6}</style><main><h1>Same companions, both directions</h1><p class="note">Watch each pet stop, sit and turn before walking the other way. Stroke a pet for floating hearts. This review uses illustrated poses with short blends, not a rigged 3D model.</p><div class="examples"><section id="cat"></section><section id="dog"></section></div><h2>Progress companions</h2><div id="ledge" class="pet-ledge"></div><p><button id="left">Walk left</button><button id="right">Walk right</button><button id="pause">Pause all</button></p></main><script src="companion-motion.js"></script><script src="mochi-widget.js"></script><script src="pet-ledge.js"></script><script>const pets=[createMochiWidget(document.getElementById('cat')),createMochiWidget(document.getElementById('dog'))];const choose=document.querySelector('#dog select');choose.value='dog';choose.dispatchEvent(new Event('change'));const ledge=createPetLedge(document.getElementById('ledge'));let paused=false;document.getElementById('pause').onclick=()=>{paused=!paused;pets.forEach((p,i)=>document.querySelectorAll('[data-mochi=motion]')[i].click());ledge.pause(paused);document.getElementById('pause').textContent=paused?'Resume all':'Pause all'};document.getElementById('left').onclick=()=>{pets.forEach(p=>p.travel(-1));ledge.travel(-1)};document.getElementById('right').onclick=()=>{pets.forEach(p=>p.travel(1));ledge.travel(1)};</script></html>

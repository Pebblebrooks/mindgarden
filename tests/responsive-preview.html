<!doctype html><html lang="en"><meta charset="utf-8"><title>Mind Garden responsive verification</title><style>body{font:16px system-ui;margin:16px;background:#edf5ef;color:#173e37}iframe{height:820px;border:1px solid #9ab4a1;background:white}pre{white-space:pre-wrap}button{font:inherit;padding:10px}#result{padding:12px;background:white}</style><h1>Mind Garden responsive verification</h1><p>Temporary automated layout check. Preview data only.</p><button id="run">Run layout checks</button><pre id="result">Ready</pre><iframe id="app" title="Mind Garden mobile preview" width="390" src="/"></iframe><script>
const frame=document.getElementById('app'),result=document.getElementById('result'),pause=ms=>new Promise(r=>setTimeout(r,ms));
document.getElementById('run').onclick=async()=>{const button=document.getElementById('run');button.disabled=true;let count=0;const failures=[];try{const w=frame.contentWindow;for(let n=0;!w.MindGardenNav&&n<100;n++)await pause(100);if(!w.MindGardenNav)throw Error('App did not load');
for(const width of [280,320,390,768,1024,1440])for(const scale of [1,2])for(const lang of ['en','zh'])for(const mode of ['light','dark']){frame.width=width;w.save.lang=lang;w.save.textScale=scale;w.save.mode=mode;w.persist();w.load();w.renderHome();w.applyPrefs();await pause(100);w.MindGardenNav.layout();await pause(80);const controls=['navAccount','language','navAppearance','navCards','navMore'].map(id=>{const n=id==='language'?w.document.querySelector('#unifiedNav .nav-actions [data-go="language"]'):w.document.getElementById(id),r=n.getBoundingClientRect();return {id,x:r.x,right:r.right,width:r.width,display:w.getComputedStyle(n).display,hidden:n.dataset.navHidden}});let error=controls.some(c=>c.width<=0||c.display==='none'||c.hidden==='true'||c.x<0||c.right>width+.5);for(let i=1;i<controls.length;i++)if(controls[i].x<controls[i-1].right-1)error=true;if(error)failures.push({width,scale,lang,mode,controls});count++;result.textContent=JSON.stringify({state:'running',completed:count,failures},null,2);}
frame.width=390;w.save.lang='en';w.save.textScale=1;w.save.mode='light';w.persist();w.load();w.renderHome();w.applyPrefs();w.me().dashboardPreferences={...w.MindGardenDisplay.prefs(),progressVisible:false};w.MindGardenDisplay.restore();await pause(100);if(w.getComputedStyle(w.document.getElementById('gardenProgressStrip')).display!=='none')failures.push('Progress did not hide');w.me().dashboardPreferences.progressVisible=true;w.MindGardenDisplay.restore();await pause(100);if(w.getComputedStyle(w.document.getElementById('gardenProgressStrip')).display==='none')failures.push('Progress did not show');w.document.querySelector('#navMenu [data-go="about"]').click();if([...w.document.querySelectorAll('.app-info p')].some(n=>w.getComputedStyle(n).textAlign!=='left'))failures.push('About alignment');w.closeOv();result.textContent=JSON.stringify({state:failures.length?'FAIL':'PASS',completed:count,failures},null,2);
}catch(e){result.textContent=JSON.stringify({state:'ERROR',completed:count,error:e.stack})}finally{button.disabled=false}};
</script></html>

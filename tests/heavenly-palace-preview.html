<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heavenly palace scenery review</title><style>body{margin:0;background:#eef3ee;color:#183e37;font:16px system-ui}header{padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{font:inherit;padding:8px 12px;border:1px solid #638879;border-radius:8px;background:white;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#183e37;color:white}iframe{width:100%;height:calc(100vh - 140px);border:0;display:block;margin:auto}#status{padding:0 12px}</style><header><strong>Palace scenery review</strong><button data-scene="cloud-palace">Cloud Palace Promenade</button><button data-scene="jade-terraces">Jade Sky Court</button><button data-scene="lotus-palace">Heavenly Gate</button><button data-scene="moon-palace">Moon Bridge Palace</button><button data-scene="golden-sanctuary">Celestial Mountain Hall</button><button data-scene="celestial-waterfall">Celestial Waterfall Citadel</button><button data-scene="sunrise-causeway">Sunrise Sky Causeway</button><button data-scene="mist-mountain">Misty Mountain Palace</button><button data-scene="starlight-court">Starlight Imperial Court</button><button data-scene="cloud-sea-harbour">Palace of the Cloud Sea</button><button id="theme">Dark mode</button><button id="width">Mobile view</button></header><p id="status">Loading preview…</p><iframe title="Mind Garden palace scenery" src="/"></iframe><script>
const frame=document.querySelector('iframe');let current='cloud-palace',mode='light';function show(){const w=frame.contentWindow;if(!w.MindGardenScenes)return;w.save.mode=mode;w.save.lang='en';w.save.textScale=1;w.persist();w.load();w.renderHome();w.applyPrefs();w.MindGardenScenes.choose(current);w.persist();w.MindGardenScenes.apply();document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scene===current));document.getElementById('theme').textContent=mode==='light'?'Dark mode':'Light mode';document.getElementById('status').textContent='FHD 1920 × 1080 • '+mode+' mode • preview only'}frame.onload=show;document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{current=b.dataset.scene;show()});document.getElementById('theme').onclick=()=>{mode=mode==='light'?'dark':'light';show()};document.getElementById('width').onclick=()=>{const mobile=frame.style.maxWidth!=='390px';frame.style.maxWidth=mobile?'390px':'';document.getElementById('width').textContent=mobile?'Desktop view':'Mobile view'};
</script></html>

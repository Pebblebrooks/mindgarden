<!doctype html><html><meta charset="utf-8"><title>Mind Garden simultaneous viewport checks</title><style>body{font:15px system-ui;margin:20px;background:#edf3ed;color:#163c30}button,select{font:inherit;padding:10px;margin:4px}#frames{display:flex;gap:10px;flex-wrap:wrap;align-items:start}.slot{width:320px;height:220px;overflow:hidden;border:1px solid #4e7566;position:relative;padding-top:24px}.slot iframe{transform-origin:top left;border:0}h3{margin:0;position:absolute;top:0;font-size:13px}pre{white-space:pre-wrap}textarea{width:100%;height:150px}#focus{max-height:960px;overflow:auto;border:2px solid #426650}#focus:empty{display:none}</style><h1>Mind Garden viewport release gate</h1><p>Each game runs in fixed-size Chromium frames in batches of three. No viewport resizing races. Real app bundles; isolated memory storage; local backend not included.</p><button id="numbers">Check numeric answers</button><button id="all">Check every game</button><button id="stop">Stop</button><select id="game"></select><select id="level"><option>1</option><option>8</option><option>15</option></select><select id="profile"><option value="0">EN light 100%</option><option value="1">ZH dark 200%</option><option value="2">EN dark 200%</option><option value="3">ZH light 100%</option></select><button id="inspect">Inspect selected game</button><select id="screen"></select><button id="enlarge">Enlarge selected viewport</button><p id="status" role="status">Loading test viewports…</p><div id="focus"></div><div id="frames"></div><h2>Latest failure</h2><pre id="failure"></pre><h2>Summary</h2><pre id="summary"></pre><h2>Audit data</h2><textarea id="data" readonly></textarea><script src="gameplay-audit.js"></script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><title>Paragraph alignment check</title><style>body{font:16px system-ui;background:#edf5ef;color:#173e37;margin:16px}iframe{height:850px;border:1px solid #8caa95}pre{white-space:pre-wrap}button{font:inherit;padding:12px}</style><h1>Paragraph alignment check</h1><button id="run">Run alignment checks</button><pre id="result">Ready</pre><iframe id="app" title="Mind Garden User guide" width="390" src="/"></iframe><script>
const frame=document.getElementById('app'),out=document.getElementById('result'),pause=ms=>new Promise(r=>setTimeout(r,ms));
document.getElementById('run').onclick=async()=>{const b=document.getElementById('run');b.disabled=true;let count=0;const failures=[];try{const w=frame.contentWindow;for(let n=0;!w.MindGardenNav&&n<100;n++)await pause(100);for(const width of [390,1280])for(const scale of [1,2])for(const lang of ['en','zh'])for(const mode of ['light','dark']){frame.width=width;w.closeOv();w.save.lang=lang;w.save.textScale=scale;w.save.mode=mode;w.persist();w.load();w.renderHome();w.applyPrefs();w.document.querySelector('#navMenu [data-go="about"]').click();await pause(100);const footer=w.document.getElementById('sceneFooter'),fs=w.getComputedStyle(footer);if(parseFloat(fs.fontSize)<19||parseFloat(fs.fontWeight)<700||fs.backgroundColor==='rgba(0, 0, 0, 0)')failures.push({width,scale,lang,mode,footer:fs.cssText});const root=w.document.querySelector('.app-info');for(const n of root.querySelectorAll('p,li')){const s=w.getComputedStyle(n);if(s.textAlign!=='left'||s.textAlignLast!=='left')failures.push({width,scale,lang,mode,type:n.tagName,text:n.textContent.slice(0,50),align:s.textAlign,last:s.textAlignLast})}for(const n of root.querySelectorAll('h1,h2,h3,h4,summary'))if(w.getComputedStyle(n).textAlign!=='center')failures.push({width,scale,lang,mode,type:n.tagName,align:w.getComputedStyle(n).textAlign});out.textContent=JSON.stringify({state:'running',completed:++count,failures},null,2)}frame.width=640;w.closeOv();w.save.lang='en';w.save.mode='dark';w.save.textScale=1;w.persist();w.load();w.renderHome();w.applyPrefs();w.document.querySelector('#navMenu [data-go="about"]').click();await pause(150);w.document.querySelector('[data-about-target="aboutUserGuide"]').click();out.textContent=JSON.stringify({state:failures.length?'FAIL':'PASS',completed:count,failures},null,2)}catch(e){out.textContent=JSON.stringify({state:'ERROR',error:e.stack})}finally{b.disabled=false}};
</script></html>
